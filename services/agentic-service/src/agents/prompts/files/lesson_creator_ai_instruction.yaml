name: lesson_creator_agent
variables: [id, history, difficulty, duration, title, description, roadmap, lessons_expected, next_lesson_index, prev_lessons]
prompt: |
    Tạo BÀI HỌC #{next_lesson_index} cho khóa "{title}".
    
    **ROADMAP**: {roadmap}
    
    # OUTPUT
    
    ```json
    {{
      "lessons": [
        {{
          "lesson_id": "{id}-L{next_lesson_index}",
          "title": "Tên bài học",
          "overview": "Mô tả mục tiêu: Sau bài học, học viên sẽ có thể [làm được gì]. (2-3 câu)",
          "content": "# Mục tiêu\n- Mục tiêu 1\n- Mục tiêu 2\n- Mục tiêu 3\n\n## Giới thiệu\n(2-3 đoạn: Giới thiệu chủ đề, tầm quan trọng, bối cảnh)\n\n## Khái niệm chính\n(3-4 đoạn: Định nghĩa, đặc điểm, cách thức hoạt động)\n\n## Ví dụ thực tế\n(2-3 ví dụ cụ thể với giải thích)\n\n## Tóm tắt\n(1-2 đoạn tổng kết điểm chính)",
          "duration": 20,
          "assessments": [
            {{
              "question": "Câu hỏi kiểm tra hiểu biết?",
              "options": ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
              "answer": 0,
              "hint": "Gợi ý",
              "explanation": "Giải thích",
              "difficulty": "medium"
            }}
          ]
        }}
      ]
    }}
    ```
    
    # YÊU CẦU
    
    1. **Overview**: Mô tả mục tiêu cụ thể (học viên sẽ làm được gì), 2-3 câu
    2. **Content**: Học thuật nhưng NGẮN GỌN - đừng viết quá dài, tầm 1500-3000 chars là đủ
    3. **Duration**: Theo biến duration (giờ), là thời gian trung bình để hoàn thành bài học
    4. **Structure**: Mục tiêu → Giới thiệu → Khái niệm → Ví dụ → Tóm tắt
    5. **Assessments**: 3 câu hỏi
    6. **Answer**: Integer 0-3 (index của array)
    7. **difficulty**: "easy", "medium", "hard" theo biến difficulty, là độ khó của câu hỏi
    8. **Options**: Đúng 4 items
    
    **QUAN TRỌNG - ĐỘ DÀI**:
    - ĐỪNG viết quá dài, content khoảng 1500-3000 chars là vừa đủ
    - Mỗi đoạn chỉ 2-3 câu ngắn gọn, đi thẳng vào vấn đề
    - Tập trung vào chất lượng, không phải số lượng
    - Viết súc tích, học thuật nhưng dễ hiểu
    
    **CHỐNG HALLUCINATION & QUY TẮC RETRIEVAL**:
    1. **RETRIEVAL LÀ BẮT BUỘC**: Bạn PHẢI gọi retrieval_tool để lấy nội dung THỰC TẾ từ tài liệu.
    2. **QUERY THÔNG MINH**: 
       - KHÔNG search tên file hay tên khóa học chung chung nếu nó vô nghĩa (như "Khóa học từ tài liệu").
       - HÃY search theo **tên bài học** trong roadmap hoặc các **khái niệm chính** liên quan đến bài học này.
         - Ví dụ: Bài học là "Định luật Newton" -> Search: "Định luật Newton định nghĩa công thức ví dụ"
       - Nếu bài học này thuộc về một chương cụ thể, hãy search tên chương đó.
    3. **CHẤT LƯỢNG NỘI DUNG**:
       - KHÔNG viết chung chung, sáo rỗng.
       - Trích xuất định nghĩa, công thức (nếu có), số liệu, sự kiện lịch sử TỪ TÀI LIỆU.
       - Nếu tài liệu là **Toán/Lý/Hóa**: Phải có công thức, định lý, ví dụ giải bài tập.
       - Nếu tài liệu là **Văn/Sử/Địa**: Phải có sự kiện, nhân vật, mốc thời gian, ý nghĩa.
       - Nếu tài liệu là **Nội bộ doanh nghiệp**: Phải dùng chính xác thuật ngữ, quy trình trong tài liệu.
    4. **DỰA VÀO CONTEXT**: Tuyệt đối trung thành với nội dung tìm được. Không bịa đặt thêm nếu không cần thiết.

    **CHIẾN LƯỢC XỬ LÝ KHI THIẾU THÔNG TIN**:
    - Nếu search lần 1 không ra, hãy thử search từ khóa khác (rộng hơn hoặc hẹp hơn).
    - KHÔNG spam cùng 1 query nhiều lần.
    
    **BẮT ĐẦU**: 
    1. Phân tích tên bài học hiện tại để chọn KEYWORD search tốt nhất.
    2. Gọi retrieval_tool(id="{id}", query="<KEYWORD TỐT NHẤT>", k=5)
    3. Đọc kết quả và viết nội dung chi tiết theo structure.
    4. Output JSON.
