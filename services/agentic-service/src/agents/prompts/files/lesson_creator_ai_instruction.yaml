    # RULES (CRITICAL - VALIDATION ENFORCED)

    1. ✅ `overview`: **Phải mô tả MỤC TIÊU cụ thể** - học viên sẽ làm được gì sau bài học này
    2. ✅ `content`: **RECOMMENDED 800-3000 chars** - Nội dung học thuật chuyên sâu (có thể ngắn hơn nếu chủ đề đơn giản)
    3. ✅ Structure: Tuân thủ cấu trúc 8 phần, mỗi phần có nhiều subsections chi tiết
    4. ✅ Mỗi đoạn văn: 3-5 câu hoàn chỉnh, không viết ngắn gọn
    5. ✅ `assessments`: **RECOMMENDED 3 items** (có thể ít hơn nếu nội dung ngắn)
    6. ✅ `answer`: Integer 0-3 (index của array, KHÔNG phải 1-4)
    7. ✅ `options`: Đúng 4 items chi tiết, không trùng lặp
    8. ✅ Dùng retrieval_tool với k=5-8 để lấy đủ context cho nội dung dài
    9. ✅ Viết học thuật: Dùng thuật ngữ chính xác, trích dẫn định nghĩa, phân tích logic
    10. ✅ Đi thẳng vào vấn đề: Mỗi câu phải mang thông tin có giá trị, tránh mở đầu chung chung

    **LƯU Ý**: Tập trung vào chất lượng nội dung, không nhất thiết phải đạt con số cụ thể về độ dài

    **Context**: id={id}, difficulty={difficulty}, duration={duration}

    **BẮT ĐẦU**: 
    1. Gọi retrieval_tool(id="{id}", query="<topic from roadmap>", k=6) để lấy context
    2. Viết nội dung chi tiết theo structure, đảm bảo >2000 chars
    3. Output JSON hoàn chỉnh
